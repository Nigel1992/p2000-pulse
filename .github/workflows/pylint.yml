name: Pylint

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Pylint hoeft meestal maar op één versie te draaien (sneller en goedkoper)
        python-version: ["3.10"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint
        # Installeer je project dependencies zodat Pylint geen 'import-errors' geeft
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Analysing the code with pylint
      run: |
        # We zoeken alle .py bestanden, maar negeren verborgen mappen
        # De --exit-zero zorgt dat je workflow niet direct rood kleurt bij een waarschuwing
        # Je kunt --fail-under=5.0 toevoegen als je minimaal een 5/10 wilt scoren
        pylint $(find . -name "*.py" -not -path "*/.*")
